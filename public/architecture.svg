<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title description">
  <title id="title">Domain-specific agent harness architecture</title>
  <desc id="description">A workspace loads a versioned persona from Git. Inside a team, a goal invokes playbooks. The runtime and harness coordinate agent execution, connector access, and specialist review. Connectors use credentials from the vault and exchange data with source apps and custom apps. Review informs revisions. In the marketplace, Research combines with Verify to build a research analyst persona and with Draft to build a briefing writer persona. Complete personas can also be listed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 8 4.5 1 8" fill="none" stroke="#464646" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #171717; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 700; }
      .name { font-size: 19px; font-weight: 650; }
      .detail { font-size: 15px; fill: #4a4a4a; }
      .panel { fill: #f8f8f8; stroke: #c8c8c8; }
      .node { fill: #fff; stroke: #b5b5b5; }
      .edge { fill: none; stroke: #464646; stroke-width: 1.5; marker-end: url(#arrow); }
      .exchange { marker-start: url(#arrow); }
      .revision { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="899" rx="16" fill="#fff" stroke="#d8d8d8"/>
  <text x="36" y="63" class="title">Domain-specific agent harness</text>

  <rect class="panel" x="36" y="102" width="250" height="245" rx="10"/>
  <rect class="panel" x="334" y="102" width="620" height="461" rx="10"/>
  <rect class="node" x="356" y="155" width="330" height="145" rx="8"/>
  <rect class="node" x="374" y="216" width="89" height="59" rx="6"/>
  <rect class="node" x="533" y="216" width="135" height="59" rx="6"/>
  <rect class="node" x="356" y="350" width="330" height="66" rx="8"/>
  <rect class="node" x="356" y="469" width="330" height="66" rx="8"/>
  <rect class="node" x="744" y="238" width="186" height="64" rx="8"/>
  <rect class="node" x="744" y="350" width="186" height="66" rx="8"/>
  <rect class="node" x="744" y="469" width="186" height="66" rx="8"/>
  <rect class="node" x="1006" y="350" width="158" height="66" rx="8"/>

  <g class="edge">
    <path d="M286 190 H330"/>
    <path d="M463 246 H529"/>
    <path d="M601 275 V346"/>
    <path class="exchange" d="M690 383 H740"/>
    <path class="exchange" d="M934 383 H1002"/>
    <path d="M837 302 V346"/>
    <path class="exchange" d="M837 420 V465"/>
    <path class="exchange" d="M521 420 V465"/>
    <path class="revision" d="M356 502 H160 V351"/>
  </g>

  <text x="56" y="140" class="heading">Persona definition</text>
  <text x="56" y="164" class="detail">Versioned in Git</text>
  <path d="M56 187 H266 M56 232 H266 M56 277 H266" stroke="#d8d8d8"/>
  <text x="56" y="217" class="name">Domain ontology</text>
  <text x="56" y="262" class="name">Teams and playbooks</text>
  <text x="56" y="307" class="name">Rules and evals</text>
  <text x="310" y="180" class="detail" text-anchor="middle">Load</text>
  <text x="250" y="490" class="detail" text-anchor="middle">Informs revisions</text>

  <text x="356" y="137" class="heading">Workspace</text>
  <text x="930" y="136" class="detail" text-anchor="end">Accounts, data, permissions, and run history</text>
  <text x="374" y="189" class="name">Team</text>
  <text x="418.5" y="252" class="name" text-anchor="middle">Goal</text>
  <text x="497" y="236" class="detail" text-anchor="middle">Invokes</text>
  <text x="600.5" y="252" class="name" text-anchor="middle">Playbooks</text>

  <text x="376" y="377" class="name">Runtime and harness</text>
  <text x="376" y="399" class="detail">Bind resources and run agents</text>
  <text x="376" y="496" class="name">Domain specialist review</text>
  <text x="376" y="518" class="detail">Evidence, approvals, and corrections</text>
  <text x="762" y="264" class="name">Vault</text>
  <text x="762" y="286" class="detail">Account credentials</text>
  <text x="762" y="377" class="name">Connectors</text>
  <text x="762" y="399" class="detail">Authorized operations</text>
  <text x="762" y="496" class="name">Custom apps</text>
