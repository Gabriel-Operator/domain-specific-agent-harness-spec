  <rect class="panel" x="36" y="601" width="1128" height="263" rx="10"/>
  <text x="56" y="639" class="heading">Marketplace</text>
  <text x="56" y="674" class="detail">Playbook packages</text>
  <text x="684" y="674" class="detail">Optional persona listings</text>

  <rect class="node" x="56" y="690" width="239" height="41" rx="6"/>
  <rect class="node" x="56" y="745" width="239" height="41" rx="6"/>
  <rect class="node" x="56" y="800" width="239" height="41" rx="6"/>
  <rect class="node" x="684" y="690" width="460" height="66" rx="8"/>
  <rect class="node" x="684" y="775" width="460" height="66" rx="8"/>

  <g class="edge">
    <path d="M295 710 H680"/>
    <path d="M295 765 H482 V736 H680"/>
    <path d="M482 765 V795 H680"/>
    <path d="M295 820 H680"/>
  </g>

  <text x="74" y="717" class="name">Verify</text>
  <text x="74" y="772" class="name">Research</text>
  <text x="74" y="827" class="name">Draft</text>
  <text x="704" y="717" class="name">Research analyst persona</text>
  <text x="704" y="739" class="detail">Research + Verify</text>
  <text x="704" y="802" class="name">Briefing writer persona</text>
  <text x="704" y="824" class="detail">Research + Draft</text>
</svg>
